<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="truck-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F64F0"/><stop offset="1" stop-color="#1739A8"/></linearGradient>
<linearGradient id="truck-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity=".45"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10203F"/><stop offset=".55" stop-color="#5B3A63"/><stop offset="1" stop-color="#F08A5D"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD9A0"/><stop offset=".35" stop-color="#FDBA74" stop-opacity=".9"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient>
</defs><rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="820" cy="520" r="260" fill="url(#sun)"/><circle cx="820" cy="520" r="70" fill="#FFE2B8"/>
<path d="M0 520 Q200 440 420 500 T860 480 T1200 470 V560 H0Z" fill="#2A1F33"/>
<path d="M0 560 Q300 500 600 545 T1200 530 V580 H0Z" fill="#1A1624"/>
<rect y="570" width="1200" height="230" fill="#0F0D14"/><rect y="570" width="1200" height="3" fill="#000" opacity=".25"/><rect x="-20" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="100" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="220" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="340" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="460" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="580" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="700" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="820" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="940" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="1060" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><rect x="1180" y="640" width="60" height="6" rx="3" fill="#F2A66B"/><g transform="translate(260 402) scale(2.6)">
        <!-- headlight beam -->
        <path d="M217 53 L260 44 L260 70 Z" fill="url(#truck-beam)"/>
        <!-- exhaust stack -->
        <rect x="124" y="2" width="4" height="34" rx="2" fill="#8FA3B8"/>
        <!-- frame rail + fifth wheel -->
        <rect x="8" y="66" width="206" height="7" rx="2" fill="#1E2A3A"/>
        <rect x="16" y="60" width="38" height="6" rx="2" fill="#33465E"/>
        <!-- fenders over drive axles -->
        <path d="M13 70 Q13 62 21 62 H71 Q79 62 79 70 Z" fill="#223042"/>
        <!-- mud flap -->
        <rect x="6" y="68" width="4" height="20" rx="1" fill="#1E2A3A"/>
        <!-- sleeper + cab + hood -->
        <path fill="url(#truck-body)" d="M80 72 V26 Q80 18 88 18 H150 L170 40 Q192 43 210 47 Q217 49 217 56 V72 H206 A16 16 0 0 0 174 72 Z"/>
        <!-- windows -->
        <path d="M134 24 H149 L163 40 H134 Z" fill="#0B0F14" opacity=".88"/>
        <rect x="90" y="26" width="24" height="9" rx="3" fill="#0B0F14" opacity=".55"/>
        <!-- window glint -->
        <path d="M140 26 L146 26 L138 38 L134 38 Z" fill="#FFFFFF" opacity=".08"/>
        <!-- door line + mirror -->
        <path d="M131 23 V64" stroke="#0B0F14" stroke-opacity=".35" stroke-width="1"/>
        <rect x="164" y="26" width="3" height="13" rx="1.5" fill="#1E2A3A"/>
        <!-- emerald pinstripe -->
        <path d="M82 62 H172" stroke="#10B981" stroke-width="2"/>
        <!-- fuel tank -->
        <rect x="96" y="64" width="38" height="12" rx="6" fill="#8FA3B8"/>
        <rect x="96" y="64" width="38" height="4" rx="2" fill="#FFFFFF" opacity=".25"/>
        <!-- bumper + headlight -->
        <rect x="205" y="68" width="15" height="6" rx="2" fill="#8FA3B8"/>
        <rect x="209" y="51" width="8" height="4" rx="2" fill="#34D399"/>
        <!-- wheels -->
        <g fill="#05070A">
          <circle cx="31" cy="80" r="12"/><circle cx="61" cy="80" r="12"/><circle cx="190" cy="80" r="12"/>
        </g>
        <g fill="#8FA3B8">
          <circle cx="31" cy="80" r="5.5"/><circle cx="61" cy="80" r="5.5"/><circle cx="190" cy="80" r="5.5"/>
        </g>
        <g fill="#10B981">
          <circle cx="31" cy="80" r="2"/><circle cx="61" cy="80" r="2"/><circle cx="190" cy="80" r="2"/>
        </g>
      </g></svg>
